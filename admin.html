<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administração — Notícias Para Todos</title>
<style>body{font:16px system-ui;background:#101e35;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(420px,90vw);background:#fff;color:#17243b;padding:2rem;border-radius:16px}label{display:block;margin-top:1rem}input,button{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;font:inherit}button{background:#1454b8;color:white;border:0;border-radius:7px;cursor:pointer}button:disabled{opacity:.6}#message{min-height:1.5em}a{color:#1454b8}</style>
<script src="/config.js"></script></head><body><main><h1>Notícias Para Todos</h1><p>Área reservada à administração</p>
<form id="login"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Palavra-passe<input id="password" type="password" autocomplete="current-password" required></label><button id="submit">Entrar</button></form>
<section id="dashboard" hidden><h2>Acesso administrativo confirmado</h2><p>A gestão de artigos permanece no Table Editor do Supabase até serem configuradas políticas de escrita seguras.</p><button id="logout">Terminar sessão</button></section>
<p id="message" role="status" aria-live="polite"></p><p><a href="/">← Voltar ao portal</a></p></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const cfg=window.PORTAL_CONFIG;
const msg=document.getElementById('message'),form=document.getElementById('login'),dashboard=document.getElementById('dashboard');
if(!cfg?.supabaseUrl||!cfg?.supabaseAnonKey){msg.textContent='Configuração de autenticação indisponível.';form.hidden=true;throw Error('Missing config');}
const supabase=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
async function refresh(){
  const {data:{user},error}=await supabase.auth.getUser();
  if(error||!user){form.hidden=false;dashboard.hidden=true;return;}
  const {data, error:roleError}=await supabase.from('profiles').select('role').eq('id',user.id).maybeSingle();
  if(roleError||data?.role!=='admin'){await supabase.auth.signOut();form.hidden=false;dashboard.hidden=true;msg.textContent='Esta conta não tem autorização de administrador.';return;}
  form.hidden=true;dashboard.hidden=false;msg.textContent='';
}
form.addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit');button.disabled=true;msg.textContent='A verificar credenciais…';try{const {error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){msg.textContent='Não foi possível iniciar sessão. Verifique os dados.';return;}await refresh();}finally{button.disabled=false;}});
document.getElementById('logout').addEventListener('click',async()=>{await supabase.auth.signOut();dashboard.hidden=true;form.hidden=false;document.getElementById('password').value='';msg.textContent='Sessão terminada.';});
await refresh();
</script></body></html>
