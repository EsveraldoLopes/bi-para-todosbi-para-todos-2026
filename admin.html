<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — Notícias Para Todos</title><link rel="stylesheet" href="admin.css"><script src="config.js" defer></script><script src="admin.js" defer></script></head><body><main class="panel wide"><header><a href="./">← Voltar ao jornal</a><button id="logout" type="button">Terminar sessão</button></header><h1>Gestão editorial</h1><p id="status" role="status">A verificar permissões…</p><section id="editor" hidden><h2 id="form-title">Novo artigo</h2><form id="article-form"><input type="hidden" id="article-id"><label>Título<input id="title" maxlength="240" minlength="3" required></label><label>Resumo<textarea id="summary" required></textarea></label><label>Texto da notícia<textarea id="body" rows="9" required></textarea></label><label>Secção<select id="category"><option>Angola</option><option>Mundo</option><option>Diáspora</option><option>Desporto</option><option>Tecnologia</option><option>Oportunidades</option></select></label><label>Autor<input id="author" value="Redação Notícias Para Todos" required></label><label>URL da fonte<input id="source_url" type="url" placeholder="https://"></label><label>URL da imagem<input id="image_url" type="url" placeholder="https://"></label><label>Descrição da imagem<input id="image_alt"></label><label>Data de publicação<input id="published_at" type="datetime-local" required></label><label class="check"><input id="published" type="checkbox"> Publicar (visível apenas a partir da data indicada)</label><div class="actions"><button id="save">Guardar artigo</button><button id="reset" type="button" class="secondary">Novo artigo</button></div></form><h2>Artigos existentes</h2><div id="article-list"></div></section></main></body></html>
