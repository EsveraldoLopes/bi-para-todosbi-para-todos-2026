<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pré-visualização responsiva — Notícias Para Todos</title><style>*{box-sizing:border-box}body{margin:0;background:#e4e8ef;font:14px Arial,sans-serif;color:#14223b}header{padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}button,a{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #aab5c7;background:white;padding:10px 16px;border-radius:8px}button[aria-pressed=true]{color:white;background:#14223b}a{padding:10px}main{overflow:auto;padding:0 12px 12px}iframe{display:block;width:375px;max-width:100%;height:calc(100vh - 90px);margin:auto;border:1px solid #aab5c7;background:white;border-radius:12px}</style></head><body><header><strong>Pré-visualização</strong><button type="button" data-width="375" aria-pressed="true">Telemóvel · 375</button><button type="button" data-width="768" aria-pressed="false">Tablet · 768</button><button type="button" data-width="1280" aria-pressed="false">Computador · 1280</button><a href="./">Abrir o portal ↗</a></header><main><iframe src="./index.html" title="Notícias Para Todos no tamanho selecionado"></iframe></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('iframe').style.width=b.dataset.width+'px';document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});</script></body></html>
